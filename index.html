<!DOCTYPE html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css"  media="screen" charset="utf-8">
  </head>
  <body>
    <aside class="more">
      <img class="more__img" src="./eisenhower-matrix.jpg" alt="advertising">
      <a class="more__inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </aside>
      <main class="main">
        <div class="add" id="topSectionForAddingElementToList">
          <h2 class="add__title">Add Item</h2>
          <div class="add__task">
            <input id="new-task" class="add__task-input task" type="text">
            <button class="btn">Add</button>
          </div>
        </div>
        <h1>Todo</h1>
        <ul class="list" id="incompleteTasks">
          <li class="item">
            <input class="item__checkbox" type="checkbox">
            <label class="task">Pay Bills</label>
            <input type="text" class="item__task task">
            <button class="edit btn">Edit</button>
            <button class="delete btn">
              <img class="delete-img" src="./remove.svg" alt="remove">
            </button>
          </li>
          <li class="item edit-mode">
            <input class="item__checkbox" type="checkbox">
            <label class="task">Go Shopping</label>
            <input type="text" value="Go Shopping" class="item__task task">
            <button class="edit btn">Save</button>
            <button class="delete btn">
              <img class="delete-img" src="./remove.svg" alt="remove">
            </button>
          </li>
        </ul>
        <h2>Completed</h2>
        <ul class="list" id="completed-tasks">
          <li class="item">
            <input class="item__checkbox" type="checkbox" checked>
            <label class="task">See the Doctor</label>
            <input type="text" class="item__task task">
            <button class="edit btn">Edit</button>
            <button class="delete btn">
              <img class="delete-img" src="./remove.svg" alt="remove">
            </button>
          </li>
        </ul>
      </main>
    <script src="app.js"></script>
  </body>
</html>
